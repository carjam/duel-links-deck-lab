[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-deck-lab"
version = "0.1.0"
description = "Collection tracker and deck recommender for Yu-Gi-Oh Duel Links, built on YGOJSON."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "ygojson",
    "rapidfuzz",
    "pytesseract",
    "Pillow",
    "requests",
]

[project.optional-dependencies]
capture = [
    "mss",
    "pygetwindow",
    "keyboard",
]
dev = [
    "pytest",
]

[project.scripts]
dl-capture = "dl_deck_lab.capture.cli:main"
dl-ocr = "dl_deck_lab.ocr.cli:main"
dl-recommend = "dl_deck_lab.recommender.cli:main"
dl-deck-check = "dl_deck_lab.decks.cli:main"
dl-deck-import = "dl_deck_lab.decks.cli_import:main"
dl-deck-view = "dl_deck_lab.decks.cli_view:main"
dl-synergy = "dl_deck_lab.synergy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
